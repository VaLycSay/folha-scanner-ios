name: Folha
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Folha:
    type: application
    platform: iOS
    sources:
      - path: Sources/Folha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valyc.folha.scanner
        INFOPLIST_FILE: .build-ci/Info-Xcode.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 4
        SWIFT_EMIT_LOC_STRINGS: YES
  FolhaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FolhaTests
    dependencies:
      - target: Folha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valyc.folha.scanner.tests
        GENERATE_INFOPLIST_FILE: YES
  FolhaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/FolhaUITests
    dependencies:
      - target: Folha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valyc.folha.scanner.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Folha:
    build:
      targets:
        Folha: all
        FolhaTests: [test]
        FolhaUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - FolhaTests
        - FolhaUITests
