name: Private DocScan Pro v5 adapter and regression tests
on:
  push:
    branches: ['private-rebrand-*']
    paths: ['private-rebrand/**', '.github/workflows/private-rebrand.yml']
permissions:
  contents: read
concurrency:
  group: private-rebrand-${{ github.ref }}
  cancel-in-progress: false
jobs:
  adapter:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and test own adapter only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PRIVATE_WORK="$RUNNER_TEMP/scanner-ux-v5"
          mkdir -p "$PRIVATE_WORK" sealed
          if bash -euo pipefail private-rebrand/build_ux.sh > "$PRIVATE_WORK/execution.log" 2>&1; then
            node private-rebrand/seal.mjs seal "$PRIVATE_WORK/adapter.zip" private-rebrand/recipient-public.pem sealed/adapter
            echo true > "$PRIVATE_WORK/job-ok"
          else
            node private-rebrand/seal.mjs seal "$PRIVATE_WORK/execution.log" private-rebrand/recipient-public.pem sealed/diagnostics
            echo false > "$PRIVATE_WORK/job-ok"
          fi
      - name: Upload encrypted adapter or diagnostics only
        uses: actions/upload-artifact@v4
        with:
          name: scanner-v5-encrypted
          path: |
            sealed/*.bin
            sealed/*.json
          if-no-files-found: error
          retention-days: 1
      - name: Report status
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/scanner-ux-v5/job-ok")" = true
