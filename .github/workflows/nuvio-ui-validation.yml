name: Nuvio iOS UI validation
on:
  workflow_dispatch:
  push:
    branches: [codex/nuvio-ios-0.5.10-r1]
    paths: [.github/workflows/nuvio-ui-validation.yml, nuvio/add-ui-tests.rb, nuvio/NuvioSmokeUITests.swift]
permissions:
  contents: read
concurrency:
  group: nuvio-ui-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios-ui:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NUVIO_IOS_DISTRIBUTION: full
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      ORG_GRADLE_PROJECT_org.gradle.jvmargs: -Xmx4096M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      ORG_GRADLE_PROJECT_kotlin.native.jvmArgs: -Xmx4096M
      ORG_GRADLE_PROJECT_kotlin.daemon.jvmargs: -Xmx1536M
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: nuvio-lab-konan-${{ runner.arch }}-0.5.10
      - name: Prepare identical application source
        run: |
          python3 harness/nuvio/fetch-source.py upstream --ios
          node harness/nuvio/apply-upgrades.mjs upstream reports
      - name: Configure public client settings
        env:
          TMDB_API_KEY: ${{ secrets.NUVIO_TMDB_API_KEY }}
        run: python3 harness/nuvio/runtime-config.py upstream
      - name: Prepare official iOS dependencies
        working-directory: upstream
        run: ./scripts/prepare-ios-dependencies.sh
      - name: Select and boot iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/nuvio-simulators.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/nuvio-simulators.json') as source:
              data = json.load(source)
          candidates = [d for runtime, devices in data['devices'].items() if 'iOS-26-' in runtime for d in devices if d['name'].startswith('iPhone') and d.get('isAvailable')]
          if not candidates:
              raise SystemExit('No compatible iPhone simulator available')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('NUVIO_SIMULATOR=' + candidates[0]['udid'] + '\n')
          print('Selected simulator:', candidates[0]['name'])
          PY
      - name: Add isolated UI test target
        run: |
          xcrun simctl boot "$NUVIO_SIMULATOR" || true
          xcrun simctl bootstatus "$NUVIO_SIMULATOR" -b
          if ! ruby -e 'require "xcodeproj"'; then gem install --user-install xcodeproj --no-document; fi
          ruby harness/nuvio/add-ui-tests.rb upstream harness/nuvio/NuvioSmokeUITests.swift
      - name: Run UI smoke tests without rebuilding device IPA
        working-directory: upstream
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme NuvioRegression -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$NUVIO_SIMULATOR" -derivedDataPath build/ios-lab-tests -resultBundlePath ../reports/NuvioUI.xcresult CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test 2>&1 | tee ../reports/ui-build.log
      - name: Export actual test results and screenshots
        if: always()
        run: |
          if [ -d reports/NuvioUI.xcresult ]; then
            xcrun xcresulttool get test-results summary --path reports/NuvioUI.xcresult > reports/ui-summary.json || true
            xcrun xcresulttool export attachments --path reports/NuvioUI.xcresult --output-path reports/ui-attachments || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuvio-ios-ui-validation
          path: reports/
          retention-days: 7
