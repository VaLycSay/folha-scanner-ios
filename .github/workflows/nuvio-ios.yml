name: Nuvio iOS Lab
on:
  workflow_dispatch:
  push:
    branches: [codex/nuvio-ios-0.5.10-r1]
    paths: [nuvio/**, .github/workflows/nuvio-ios.yml]
permissions:
  contents: read
concurrency:
  group: nuvio-lab-${{ github.ref }}
  cancel-in-progress: false
env:
  UPSTREAM_SHA: 6d435785c0e082ae3d4fbb8152e1ff5e45c2e575
jobs:
  compose-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Obtain fixed official source archive
        run: python3 harness/nuvio/fetch-source.py upstream
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply compatible improvements
        run: |
          node harness/nuvio/apply-upgrades.mjs upstream reports
          cp harness/nuvio/TimelineTouchRegressionTest.kt upstream/composeApp/src/androidHostTest/kotlin/com/nuvio/app/features/player/
          touch upstream/local.properties
      - name: Run shared player and Compose UI regression tests
        working-directory: upstream
        env:
          ORG_GRADLE_PROJECT_org.gradle.jvmargs: -Xmx4096M -Dfile.encoding=UTF-8
          ORG_GRADLE_PROJECT_kotlin.daemon.jvmargs: -Xmx2048M
        run: |
          ./gradlew :composeApp:testAndroidHostTest -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuvio-compose-test-results
          path: |
            reports/
            upstream/composeApp/build/test-results/
            upstream/composeApp/build/reports/tests/
          retention-days: 7
  ios-build:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: Release
      NUVIO_GRADLE_JVMARGS: -Xmx4096M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4096M
      ORG_GRADLE_PROJECT_kotlin.daemon.jvmargs: -Xmx1536M
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Obtain fixed official source and iOS submodule archives
        run: python3 harness/nuvio/fetch-source.py upstream --ios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: nuvio-lab-konan-${{ runner.arch }}-0.5.10
      - name: Apply compatible improvements
        run: node harness/nuvio/apply-upgrades.mjs upstream reports
      - name: Configure public client settings
        env:
          TMDB_API_KEY: ${{ secrets.NUVIO_TMDB_API_KEY }}
        run: python3 harness/nuvio/runtime-config.py upstream
      - name: Prepare official iOS dependencies
        working-directory: upstream
        run: ./scripts/prepare-ios-dependencies.sh
      - name: Build Release IPA using original packaging checks
        working-directory: upstream
        run: ./scripts/build-ios-ipa.sh
      - name: Retain unsigned IPA and source-change manifest
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-0.5.10-Lab-r1-unsigned
          path: |
            upstream/build/ios-ipa/*.ipa
            reports/changes.json
            harness/nuvio/README.md
          if-no-files-found: error
          retention-days: 7
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/nuvio-simulators.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/nuvio-simulators.json'))
          candidates = [d for runtime, devices in data['devices'].items() if 'iOS-26-' in runtime for d in devices if d['name'].startswith('iPhone') and d.get('isAvailable')]
          if not candidates: raise SystemExit('No compatible iPhone simulator available')
          device = candidates[0]
          with open(os.environ['GITHUB_ENV'], 'a') as out: out.write('NUVIO_SIMULATOR=' + device['udid'] + '\n')
          print('Selected simulator:', device['name'])
          PY
      - name: Boot simulator and add UI smoke target
        run: |
          xcrun simctl boot "$NUVIO_SIMULATOR" || true
          xcrun simctl bootstatus "$NUVIO_SIMULATOR" -b
          if ! ruby -e 'require "xcodeproj"'; then gem install --user-install xcodeproj --no-document; fi
          ruby harness/nuvio/add-ui-tests.rb upstream harness/nuvio/NuvioSmokeUITests.swift
      - name: Run iOS UI smoke tests
        working-directory: upstream
        env:
          NUVIO_IOS_DISTRIBUTION: full
          ORG_GRADLE_PROJECT_org.gradle.jvmargs: -Xmx4096M -Dfile.encoding=UTF-8
          ORG_GRADLE_PROJECT_kotlin.native.jvmArgs: -Xmx4096M
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme NuvioRegression -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$NUVIO_SIMULATOR" -derivedDataPath build/ios-lab-tests -resultBundlePath ../reports/NuvioUI.xcresult CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      - name: Capture simulator screenshot
        if: always() && env.NUVIO_SIMULATOR != ''
        run: xcrun simctl io "$NUVIO_SIMULATOR" screenshot reports/ios-last-screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuvio-ios-diagnostics
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
