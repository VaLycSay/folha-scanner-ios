name: Build unsigned iOS app
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: folha-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Obtain project generator
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
      - name: Compile and package without Apple login
        run: bash scripts/build_ipa.sh
      - name: Keep unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Folha-unsigned
          path: |
            artifacts/Folha-unsigned.ipa
            artifacts/Folha-unsigned.sha256
            artifacts/Folha-unsigned.json
            artifacts/LEIA-ME.txt
          if-no-files-found: error
          retention-days: 3
      - name: Keep diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Folha-diagnostics
          path: reports/
          if-no-files-found: ignore
          retention-days: 3
