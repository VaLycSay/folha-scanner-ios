name: REA reconstruction - tests and unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main, 'rea-integration-*']
permissions:
  contents: read
concurrency:
  group: scanner-rea-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Obtain project generator
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - name: Test recovered flows and package device app
        run: bash scripts/build_reconstruction.sh
      - name: Preserve unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Scanner-REA-0.5.0
          path: |
            artifacts/*.ipa
            artifacts/*.json
            artifacts/*.sha256
            artifacts/LEIA-ME.md
          if-no-files-found: error
          retention-days: 7
      - name: Preserve test diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Scanner-REA-tests
          path: |
            reports/*.log
            reports/*.json
            reports/screenshots/*.png
            reports/screenshots/*.txt
            reports/screenshots/*.json
            reports/screenshots/*.mp4
            reports/screenshots-retry/*.png
            reports/screenshots-retry/*.txt
            reports/screenshots-retry/*.json
            reports/screenshots-retry/*.mp4
          if-no-files-found: ignore
          retention-days: 7
